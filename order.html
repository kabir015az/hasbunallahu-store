<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders | Hasbunallahu Store</title>


    <!-- Main Store CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Supabase Client -->
    <script src="js/supabase.js"></script>


    <!-- Main JavaScript -->
    <script
        defer
        src="js/main.js"
    ></script>


    <!-- Authentication -->
    <script
        defer
        src="js/auth.js"
    ></script>


    <!-- Orders -->
    <script
        defer
        src="js/order.js"
    ></script>

</head>


<body>


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header>

        <nav class="navbar">


            <a
                href="index.html"
                class="logo"
            >
                Hasbunallahu Store
            </a>


            <button
                type="button"
                class="menu-toggle"
                id="menu-toggle"
                aria-label="Open menu"
            >
                ☰
            </button>


            <ul class="nav-links">


                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>


                <li>
                    <a href="products.html">
                        Products
                    </a>
                </li>


                <li>
                    <a href="wishlist.html">
                        Wishlist ❤️
                        <span id="wishlist-count">
                            0
                        </span>
                    </a>
                </li>


                <li>
                    <a href="cart.html">
                        Cart 🛒
                        <span id="cart-count">
                            0
                        </span>
                    </a>
                </li>


                <li>
                    <a
                        href="order.html"
                        class="active"
                    >
                        My Orders 📦
                    </a>
                </li>


                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>


                <li>
                    <a href="contact.html">
                        Contact
                    </a>
                </li>


                <!-- Login -->
                <li class="login-link">
                    <a href="login.html">
                        Login
                    </a>
                </li>


                <!-- Register -->
                <li class="register-link">
                    <a href="register.html">
                        Register
                    </a>
                </li>


                <!-- Logged-in customer -->
                <li class="account-user">
                </li>


                <!-- Logout -->
                <li>
                    <button
                        type="button"
                        class="logout-btn"
                        onclick="logoutCustomer()"
                        style="display:none;"
                    >
                        Logout
                    </button>
                </li>

            </ul>

        </nav>

    </header>


    <!-- ==========================================
         PAGE BANNER
    =========================================== -->

    <section class="page-banner">

        <h1>
            My Orders 📦
        </h1>

        <p>
            View your orders, products,
            payment status and delivery information.
        </p>

    </section>


    <!-- ==========================================
         ORDERS
    =========================================== -->

    <main>

        <section
            id="orders-container"
            class="orders-container"
        >

            <!-- order.js loads orders here -->

            <div class="empty-orders">

                <h2>
                    Loading Orders... 📦
                </h2>

                <p>
                    Please wait.
                </p>

            </div>

        </section>

    </main>


    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer>

        <p>
            &copy; 2026 Hasbunallahu Store.
            All Rights Reserved.
        </p>

    </footer>


</body>

</html>

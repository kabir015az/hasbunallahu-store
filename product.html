<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Hasbunallahu Store</title>

  <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/products.css">

<script defer src="js/main.js"></script>
<script defer src="js/products.js"></script>
</head>
<body>

    <!-- Header -->
    <header>
        <nav class="navbar">
            <h2 class="logo">Hasbunallahu Store</h2>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="products.html">Products</a></li>
<li><a href="wishlist.html">Wishlist <span id="wishlist-count">0</span></a></li>
<li><a href="cart.html">Cart <span id="cart-count">0</span></a></li>
                <li><a href="cart.html">Cart <span id="cart-count">0</span></a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Product Details -->
    <main class="product-details">

        <div class="product-image">
            <img id="product-image" src="images/placeholder.jpg" alt="Product Image">
        </div>

        <div class="product-info">

            <h1 id="product-name">Product Name</h1>

            <p class="price" id="product-price">₦0.00</p>

            <p id="product-description">
                Product description will appear here.
            </p>

            <label for="quantity">Quantity</label>

            <input
                type="number"
                id="quantity"
                value="1"
                min="1">

            <button id="add-to-cart-btn">
                Add to Cart
            </button>

        </div>

    </main>

    <!-- Related Products -->
    <section class="related-products">

        <h2>You May Also Like</h2>

        <div id="related-products-container">
            <!-- Related products will load here -->
        </div>

    </section>

    <!-- Footer -->
    <footer>

        <p>&copy; 2026 Hasbunallahu Store. All Rights Reserved.</p>

    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Hasbunallahu Store</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">

    <script defer src="js/main.js"></script>
    <script defer src="js/products.js"></script>
    <script defer src="js/product.js"></script>
</head>

<body>

<header>

    <nav class="navbar">

        <h2 class="logo">Hasbunallahu Store</h2>
<button class="menu-toggle" id="menu-toggle">
    ☰
</button>
        <ul class="nav-links">

    <li>
        <a href="index.html">Home</a>
    </li>

    <li>
        <a href="products.html">Products</a>
    </li>

    <li>
        <a href="wishlist.html">
            Wishlist ❤️
            <span id="wishlist-count">0</span>
        </a>
    </li>

    <li>
        <a href="cart.html">
            Cart 🛒
            <span id="cart-count">0</span>
        </a>
    </li>

    <li>
        <a href="orders.html">
            My Orders 📦
        </a>
    </li>

    <li>
        <a href="about.html">About</a>
    </li>

    <li>
        <a href="contact.html">Contact</a>
    </li>

</ul>

    </nav>

</header>

<main class="product-details">

    <div class="product-image">

        <img
            id="product-image"
            src="images/placeholder.jpg"
            alt="Product Image">

    </div>

    <div class="product-info">

        <h1 id="product-name">Loading...</h1>

        <p class="price" id="product-price">₦0.00</p>

        <p>
            <strong>Category:</strong>
            <span id="product-category"></span>
        </p>

        <p id="product-description">
            Product description...
        </p>

        <label>Quantity</label>

        <input
            type="number"
            id="quantity"
            value="1"
            min="1">

        <button id="add-to-cart-btn">
            Add To Cart
        </button>

    </div>

</main>

<footer>

    <p>&copy; 2026 Hasbunallahu Store. All Rights Reserved.</p>

</footer>

</body>
</html>

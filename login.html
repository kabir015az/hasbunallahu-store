<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Hasbunallahu Store</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .auth-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .auth-container h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-form label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .auth-form input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .auth-form button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #198754;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .auth-form button:hover {
            background: #157347;
        }

        .auth-form button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .auth-message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
        }

        .auth-link a {
            color: #198754;
            font-weight: bold;
            text-decoration: none;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


    <!-- ==========================================
         NAVIGATION
         ========================================== -->

    <header>

        <nav class="navbar">

            <h2 class="logo">
                Hasbunallahu Store
            </h2>


            <button
                class="menu-toggle"
                id="menu-toggle"
                type="button"
            >
                ☰
            </button>


            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>


                <li>
                    <a href="products.html">
                        Products
                    </a>
                </li>


                <li>
                    <a href="cart.html">
                        Cart 🛒
                        <span id="cart-count">0</span>
                    </a>
                </li>


                <li>
                    <a href="order.html">
                        My Orders 📦
                    </a>
                </li>


                <li>
                    <a href="register.html">
                        Register
                    </a>
                </li>

            </ul>

        </nav>

    </header>



    <!-- ==========================================
         LOGIN
         ========================================== -->

    <main>

        <div class="auth-container">

            <h1>
                Customer Login
            </h1>


            <form
                id="login-form"
                class="auth-form"
            >


                <!-- EMAIL -->

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="login-button"
                >
                    Login
                </button>

            </form>


            <!-- MESSAGE -->

            <p
                id="login-message"
                class="auth-message"
            ></p>


            <!-- REGISTER -->

            <div class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </div>

    </main>



    <!-- ==========================================
         FOOTER
         ========================================== -->

    <footer>

        <p>
            &copy; 2026 Hasbunallahu Store.
            All Rights Reserved.
        </p>

    </footer>



    <!-- ==========================================
         SUPABASE LIBRARY
         ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <!-- ==========================================
         HASBUNALLAHU STORE SUPABASE CLIENT
         ========================================== -->

    <script
        src="js/supabase.js"
    ></script>



    <!-- ==========================================
         LOGIN
         ========================================== -->

    <script>

        const loginForm =
            document.getElementById(
                "login-form"
            );


        const loginButton =
            document.getElementById(
                "login-button"
            );


        const loginMessage =
            document.getElementById(
                "login-message"
            );


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                if (!email || !password) {

                    loginMessage.textContent =
                        "❌ Please enter your email and password.";

                    return;

                }


                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "Logging in...";

                loginMessage.textContent =
                    "";


                try {

                    /* ==================================
                       SUPABASE LOGIN
                       ================================== */

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signInWithPassword({

                                email:
                                    email,

                                password:
                                    password

                            });


                    if (error) {

                        throw error;

                    }


                    if (!data || !data.user) {

                        throw new Error(
                            "Login was not completed."
                        );

                    }


                    /* ==================================
                       VERIFY SESSION
                       ================================== */

                    const {
                        data: sessionData,
                        error: sessionError
                    } =
                        await supabaseClient
                            .auth
                            .getSession();


                    if (sessionError) {

                        throw sessionError;

                    }


                    if (
                        !sessionData ||
                        !sessionData.session
                    ) {

                        throw new Error(
                            "Login successful, but the session could not be created."
                        );

                    }


                    console.log(
                        "Login successful:",
                        data.user.email
                    );


                    loginMessage.textContent =
                        "✅ Login successful!";


                    /* ==================================
                       GET REDIRECT PAGE
                       ================================== */

                    const urlParams =
                        new URLSearchParams(
                            window.location.search
                        );


                    const redirect =
                        urlParams.get(
                            "redirect"
                        ) || "index.html";


                    /* ==================================
                       REDIRECT
                       ================================== */

                    setTimeout(
                        function () {

                            window.location.href =
                                redirect;

                        },
                        500
                    );

                }

                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    loginMessage.textContent =
                        "❌ " +
                        (
                            error.message ||
                            "Unable to login."
                        );


                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                }

            }
        );

    </script>



    <!-- ==========================================
         MAIN JAVASCRIPT
         ========================================== -->

    <script
        src="js/main.js"
    ></script>


</body>

</html>

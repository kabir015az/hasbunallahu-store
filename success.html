<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | Hasbunallahu Store</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .success-box{
            background:#fff;
            padding:40px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
            max-width:500px;
            width:90%;
        }

        .success-box h1{
            color:#28a745;
            margin-bottom:15px;
        }

        .success-box p{
            color:#555;
            margin-bottom:25px;
            line-height:1.6;
        }

        .btn{
            display:inline-block;
            padding:12px 24px;
            background:#007bff;
            color:#fff;
            text-decoration:none;
            border-radius:6px;
        }

        .btn:hover{
            background:#0056b3;
        }
    </style>
</head>
<body>

<div class="success-box">

    <h1>✅ Payment Successful</h1>

    <p>
        Thank you for shopping with <strong>Hasbunallahu Store</strong>.<br>
        Your payment has been received successfully.
    </p>

    <a href="index.html" class="btn">
        Continue Shopping
    </a>

</div>

</body>
</html>

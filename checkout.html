<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | Hasbunallahu Store</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css">

</head>

<body>

    <main class="checkout-container">

        <h1 class="checkout-title">
            🛒 Checkout
        </h1>


        <div class="checkout-layout">

            <!-- =====================================
                 LEFT SIDE - CUSTOMER DETAILS
            ====================================== -->

            <div class="checkout-left">

                <section class="checkout-section customer-section">

                    <h2>👤 Customer Details</h2>

                    <form id="checkout-form">

                        <div class="form-group">

                            <label for="fullname">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="fullname"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                placeholder="Enter your phone number"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email address"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="address">
                                Delivery Address
                            </label>

                            <textarea
                                id="address"
                                placeholder="Enter your delivery address"
                                required
                            ></textarea>

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="state">
                                    State
                                </label>

                                <input
                                    type="text"
                                    id="state"
                                    placeholder="Enter your state"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="city">
                                    City
                                </label>

                                <input
                                    type="text"
                                    id="city"
                                    placeholder="Enter your city"
                                    required
                                >

                            </div>

                        </div>

                    </form>

                </section>

            </div>


            <!-- =====================================
                 RIGHT SIDE
            ====================================== -->

            <div class="checkout-right">


                <!-- COUPON -->

                <section class="checkout-section">

                    <h2>🎟️ Discount Coupon</h2>

                    <div class="coupon-box">

                        <input
                            type="text"
                            id="coupon-code"
                            placeholder="Enter coupon code"
                        >

                        <button
                            type="button"
                            id="apply-coupon"
                        >
                            Apply Coupon
                        </button>

                    </div>

                    <p id="coupon-message"></p>

                </section>


                <!-- ORDER SUMMARY -->

                <section class="checkout-section order-summary">

                    <h2>📦 Order Summary</h2>

                    <div id="checkout-summary">

                        <p class="total-row">

                            <span>
                                Total:
                            </span>

                            <strong id="checkout-total">
                                ₦0
                            </strong>

                        </p>

                    </div>

                </section>


                <!-- PAYMENT -->

                <section class="checkout-section payment-section">

                    <h2>💳 Payment</h2>

                    <p class="payment-text">
                        Secure payment powered by Paystack.
                    </p>

                    <button
                        type="button"
                        id="place-order"
                    >
                        Place Order
                    </button>

                </section>

            </div>

        </div>


        <!-- CONTINUE SHOPPING -->

        <div class="continue-shopping">

            <a href="index.html">
                ← Continue Shopping
            </a>

        </div>

    </main>

</body>

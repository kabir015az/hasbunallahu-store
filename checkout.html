<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | Hasbunallahu Store</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css">

</head>

<body>

    <!-- ==========================================
         CHECKOUT
    =========================================== -->

    <main class="checkout-container">

        <h1>🛒 Checkout</h1>

        <!-- Customer Details -->

        <section class="checkout-section">

            <h2>Customer Details</h2>

            <form id="checkout-form">

                <label for="fullname">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullname"
                    placeholder="Enter your full name"
                    required
                >


                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >


                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    required
                >


                <label for="address">
                    Delivery Address
                </label>

                <textarea
                    id="address"
                    placeholder="Enter your delivery address"
                    required
                ></textarea>


                <label for="state">
                    State
                </label>

                <input
                    type="text"
                    id="state"
                    placeholder="Enter your state"
                    required
                >


                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    placeholder="Enter your city"
                    required
                >

            </form>

        </section>


        <!-- ==========================================
             COUPON
        =========================================== -->

        <section class="checkout-section">

            <h2>🎟️ Discount Coupon</h2>

            <div class="coupon-box">

                <input
                    type="text"
                    id="coupon-code"
                    placeholder="Enter coupon code"
                >

                <button
                    type="button"
                    id="apply-coupon"
                >
                    Apply Coupon
                </button>

            </div>

            <p id="coupon-message"></p>

        </section>


        <!-- ==========================================
             ORDER SUMMARY
        =========================================== -->

        <section class="checkout-section">

            <h2>📦 Order Summary</h2>

            <div id="checkout-summary">

                <p>
                    Total:
                    <strong id="checkout-total">
                        ₦0
                    </strong>
                </p>

            </div>

        </section>


        <!-- ==========================================
             PAYMENT
        =========================================== -->

        <section class="checkout-section">

            <h2>💳 Payment</h2>

            <p>
                Secure payment powered by Paystack.
            </p>

            <button
                type="button"
                id="place-order"
            >
                Place Order
            </button>

        </section>


        <br>

        <a href="index.html">
            ← Continue Shopping
        </a>

    </main>
